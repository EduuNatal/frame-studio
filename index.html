<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Studio v0.1</title>
<style>
:root{--bg:#000;--bg2:#050508;--panel:#0b0a10;--panel2:#14121b;--line:#25222f;--tx:#ece9f7;--mut:#9b94b8;--ac:#8b5cf6;--ac2:#a78bfa;--acd:#6d3fe0;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh}
#top{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:16px}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--ac),#c084fc);display:grid;place-items:center;font-size:14px}
.pill{background:var(--acd);border-radius:6px;padding:1px 7px;font-size:11px}
.sep{width:1px;height:24px;background:var(--line);margin:0 6px}
.grow{flex:1}
#pname{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;width:200px;font-weight:600}
#pname:hover,#pname:focus{border-color:var(--line);outline:none;background:var(--panel)}
.status{color:var(--mut);font-size:12px}
.btn,.ic{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer}
.btn:hover,.ic:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);font-weight:600}
.btn.pri:hover{background:var(--ac2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.bad:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ic{padding:6px 10px}
#side{background:var(--bg2);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav{display:block;text-align:left;width:100%;background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 12px;cursor:pointer}
.nav b{display:block;font-weight:600}
.nav small{color:var(--mut);font-size:11.5px}
.nav:hover{background:var(--panel)}
.nav.on{background:var(--panel2);border-color:#2f2750;box-shadow:inset 3px 0 0 var(--ac)}
.nav.on b{color:var(--ac2)}
.tlwrap{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}
.tllabels{flex:0 0 58px;border-right:1px solid var(--line);font-size:12px;color:var(--mut)}
.tllabels div{height:26px;display:flex;align-items:center;padding-left:8px}.tllabels div.v{height:40px}.tllabels div.a{height:60px}
.tlscroll{flex:1;overflow-x:auto;position:relative}
.tlin{position:relative}
.ruler{height:26px;position:relative;border-bottom:1px solid var(--line);cursor:pointer}
.tk{position:absolute;top:0;height:100%;border-left:1px solid var(--line);padding-left:3px;font-size:11px;color:var(--mut);padding-top:5px}
.trk{position:relative;border-bottom:1px solid var(--line)}
.trk.v{height:40px}.trk.a{height:60px}
.vb{position:absolute;top:4px;bottom:4px;background:#241b45;border:1px solid var(--acd);border-radius:6px;font-size:11px;padding:2px 6px;overflow:hidden;white-space:nowrap}
.clip{position:absolute;top:4px;bottom:4px;background:#1b1530;border:1px solid var(--acd);border-radius:6px;overflow:hidden;cursor:grab;touch-action:none}
.clip.sel{border-color:#fff;box-shadow:0 0 0 1px var(--ac)}
.clip canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.clip .cn{position:absolute;left:8px;top:2px;font-size:10.5px;pointer-events:none;color:#ddd}
.clip .h{position:absolute;top:0;bottom:0;width:9px;background:var(--ac);opacity:.7;cursor:ew-resize}.clip .h.l{left:0}.clip .h.r{right:0}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:3}
.ph::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#fff}
.insp{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px}
.insp input[type=number]{width:70px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
.insp input[type=range]{accent-color:var(--ac)}
.nav.soon b::after{content:" · em breve";font-weight:400;color:var(--mut);font-size:11px}
#main{min-width:0;min-height:0;overflow:hidden;position:relative}
.mut{color:var(--mut)}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;background:var(--panel2);border:1px solid var(--line)}
.chip.ok{color:var(--ok);border-color:#1f6b52}.chip.warn{color:var(--warn);border-color:#7a5d12}.chip.bad{color:var(--bad);border-color:#7a2b2b}.chip.info{color:var(--info);border-color:#27508a}.chip.none{color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:auto}
.bg-checker{background-color:#fff;background-image:linear-gradient(45deg,#c9c9d4 25%,transparent 25%,transparent 75%,#c9c9d4 75%),linear-gradient(45deg,#c9c9d4 25%,transparent 25%,transparent 75%,#c9c9d4 75%);background-size:20px 20px;background-position:0 0,10px 10px}
.bg-white{background:#fff}.bg-black{background:#000}
.stagebox,.pvbox,.labbox{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
/* dashboard */
.dash{height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.dtop{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px}
.pvbox{height:340px}
.ctl{display:flex;gap:10px;align-items:center;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
.tile small{color:var(--mut);display:block;margin-bottom:4px}
.tile .big{font-size:26px;font-weight:700}
.tile input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.act{background:var(--bg2);border:1px dashed var(--line);border-radius:var(--r);padding:10px;min-height:200px}
.act.over{border-color:var(--ac);background:#1a1430}
.ah{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ah b{letter-spacing:.08em;color:var(--ac2)}
.cards{display:flex;flex-direction:column;gap:8px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.scard:hover{border-color:var(--ac2)}
.scard.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.scard.over{outline:2px solid var(--ac)}
.sc-top{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.sc-title{font-weight:600;margin:4px 0 6px}
.sc-th{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sc-th .t{width:64px;height:64px;border-radius:8px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--mut);font-size:11px}
.prog{height:5px;background:var(--bg);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac)}
.sc-meta{font-size:12px;color:var(--mut);margin-top:4px}
.add{background:transparent;border:1px dashed var(--line);border-radius:10px;padding:8px;color:var(--mut);cursor:pointer}
.add:hover{color:var(--tx);border-color:var(--ac)}
.panel{background:var(--panel);border:1px solid var(--ac);border-radius:var(--r);padding:12px}
.phead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.phead input[type=text]{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.phead input[type=number],.props input[type=number],.props select,.fbar select,.tr select,.tr input[type=number]{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 6px;width:72px}
.props select,.fbar select,.tr select{width:auto}
.big-frame{display:flex;gap:14px;margin-top:10px;align-items:flex-start}
.big-frame .bimg{width:260px;height:260px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.big-frame img{max-width:100%;max-height:100%}
/* frames view */
.fv{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100%;gap:12px;padding:12px}
.fstage{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.fstage .stagebox{flex:1;min-height:120px}
.fbar,.tr,.sbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:4px 10px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--acd);color:#fff}
.tr{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.tr input[type=range]{flex:1;min-width:80px;accent-color:var(--ac)}
.sdiv{flex:0 0 auto;width:62px;border-left:2px solid var(--ac);border-radius:6px;padding:4px 6px;font-size:12px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;color:var(--mut)}
.sdiv b{color:var(--ac2)}.sdiv.on{background:#241c44}.sdiv.over{outline:2px dashed var(--ac2)}
.strip{position:relative;display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:128px}
.thumb{flex:0 0 auto;width:84px;text-align:center;font-size:12px;color:var(--mut);cursor:pointer;border-radius:8px;padding:3px}
.thumb.sel{outline:2px solid var(--ac);background:#241c44;color:#fff}
.thumb.over{outline:2px dashed var(--ac2)}
.thumb.dragging{opacity:.4}
.timg{position:relative;width:78px;height:78px;border-radius:6px;overflow:hidden;display:grid;place-items:center;background:#1a1824}
.timg img{max-width:100%;max-height:100%}
.timg .x{position:absolute;right:2px;bottom:2px;background:var(--acd);color:#fff;border-radius:5px;padding:0 4px;font-size:10px}
.scenebox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scenebox.open{border-color:var(--ac)}
.sbbar{display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap}
.plus{width:30px;height:28px;border-radius:8px;background:var(--ac);border:0;font-size:18px;line-height:1;cursor:pointer;color:#fff}
.plus:hover{background:var(--ac2)}
.schip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--mut)}
.schip:hover{border-color:var(--ac2);color:var(--tx)}
.schip.on{border-color:var(--ac);color:#fff;background:#241c44}
.sbinfo{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:10px;border-top:1px solid var(--line);font-size:13px}
.sbhead{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;padding:10px 14px;cursor:pointer;text-align:left}
.sbhead:hover{background:var(--panel2)}
.sbhead b{color:var(--ac2)}
.grid-all{display:flex;flex-wrap:wrap;gap:8px;padding:10px;max-height:240px;overflow:auto;border-top:1px solid var(--line)}
.grid-all .thumb{width:96px}.grid-all .timg{width:90px;height:90px}
.empty{color:var(--mut);align-self:center;padding:10px}
.props{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow:auto;min-height:0}
.props h4{margin:14px 0 8px;font-size:13px;color:var(--ac2);letter-spacing:.05em;text-transform:uppercase}
.props h4:first-child{margin-top:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.row input[type=range]{accent-color:var(--ac);width:120px}
.chk{display:inline-flex;align-items:center;gap:6px}
.chk input{accent-color:var(--ac)}
/* ai & lab */
.page{height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.banner{background:#2a1f12;border:1px solid #7a5d12;color:#fde7a6;border-radius:var(--r);padding:10px 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px}
.slot.lock{border-color:var(--warn)}
.slot .simg{height:140px;border-radius:8px;display:grid;place-items:center;overflow:hidden;background:#2a2640;color:var(--mut);font-size:12px;text-align:center;padding:4px}
.slot .simg img{max-width:100%;max-height:100%}
.slot .bt{display:flex;gap:6px;flex-wrap:wrap}
.refs{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--mut)}
.refs img{width:26px;height:26px;object-fit:cover;border-radius:4px}
textarea.in,input.in{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.labbox{width:200px;height:260px;flex:0 0 auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
details summary{cursor:pointer;color:var(--ac2)}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50}
#modal.on{display:grid}
.mbox{background:var(--panel);border:1px solid var(--ac);border-radius:14px;padding:18px;width:min(520px,92vw);max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--ac);padding:9px 16px;border-radius:10px;z-index:60;display:none;max-width:80vw}
:root{color-scheme:dark}
@media (max-width:820px){
 html,body{overflow:auto}
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;height:auto;min-height:100vh}
 #top{grid-column:1;flex-wrap:wrap;padding:8px 16px}
 #side{flex-direction:row;overflow-x:auto;padding:8px 16px;border-right:0;border-bottom:1px solid var(--line)}
 #side .grow{display:none}.nav{white-space:nowrap;width:auto}.nav small{display:none}
 #main{overflow:visible}
 .dash,.page{height:auto;overflow:visible;padding:16px}
 .dtop,.acts{grid-template-columns:minmax(0,1fr)}
 .fv{grid-template-columns:minmax(0,1fr);height:auto;padding:16px}
 .fstage .stagebox{height:60vh;flex:none}
 #pname{width:130px}.status{display:none}
 table.t{display:block;overflow-x:auto}
 .grid2,.slots{grid-template-columns:minmax(0,1fr)}
  .fv.lay-curto{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:none!important;grid-template-areas:none}
 .lay-curto .fstage{display:flex}.lay-curto .fbar{display:flex}.lay-curto .strip{display:flex}.lay-curto .sbar{display:flex}
 .lay-curto .playcol{flex:1 0 320px}
}
#ov{position:absolute;inset:0;pointer-events:none}
.stagebox.zoomed{display:flex;overflow:auto}
.stagebox.zoomed .cv{position:static;transform:none;margin:auto;flex:none}
.vmenu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--ac);border-radius:12px;padding:6px;min-width:270px;max-height:82vh;overflow:auto;box-shadow:0 12px 40px #000c}
.vmenu h5{margin:10px 8px 3px;font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.vmenu h5:first-child{margin-top:4px}
.vi{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;border-radius:8px;padding:5px 8px;cursor:pointer;text-align:left}
.vi:hover{background:var(--panel2)}.vi i{width:14px;font-style:normal;color:var(--ac2)}.vi kbd{margin-left:auto;color:var(--mut);font-size:11px;font-family:inherit}
.lay-linha .stagebox{flex:0 0 34%!important}.lay-linha .thumb{width:112px}.lay-linha .timg{width:106px;height:106px}.lay-linha .strip{min-height:170px}
.lay-organizar .stagebox{flex:0 0 28%!important}.lay-organizar .grid-all{max-height:48vh}
/* timeline estilo Filmora */
.tlcard{padding:10px}
.tlwrap,.tlwrap *{user-select:none;-webkit-user-select:none}
body.dragging-tl,body.dragging-tl *{user-select:none!important;-webkit-user-select:none!important;cursor:ew-resize!important}
.tltools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tltools input[type=range]{width:110px;accent-color:var(--ac)}
.tcode{font-variant-numeric:tabular-nums;color:var(--ac2);font-weight:700;letter-spacing:.04em}
.ic.on{border-color:#22c55e;color:#4ade80}
.tllabels{flex:0 0 78px}
.tllabels .vl{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:4px 6px;border-top:1px solid var(--line)}
.tllabels .vl span{display:flex;gap:2px}
.tb{background:none;border:0;cursor:pointer;padding:0 2px;font-size:13px;color:var(--tx)}
.tlscroll{overflow-y:hidden}
.ruler{cursor:ew-resize}
.mt{position:absolute;bottom:0;width:1px;height:6px;background:#3a3550}
.tk{font-variant-numeric:tabular-nums}
.vclip{position:absolute;top:4px;bottom:4px;border:1px solid #4c3a8a;border-radius:6px;overflow:hidden;cursor:grab;background:#10081f;touch-action:none}
.vclip:active{cursor:grabbing}
.vclip.sel{border-color:#fff;box-shadow:0 0 0 1px var(--ac)}
.vclip canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vclip .cn{position:absolute;left:6px;top:2px;font-size:11px;background:#000b;border-radius:4px;padding:0 5px;pointer-events:none;max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vclip .h{position:absolute;top:0;bottom:0;right:0;width:9px;background:var(--ac);opacity:.55;cursor:ew-resize}
.clip{bottom:auto}
.ph{background:#ef4444}.ph::before{border-top-color:#ef4444}
.schip{display:inline-flex;align-items:center;gap:6px;padding:2px 11px 2px 3px}
.sth{width:36px;height:36px;border-radius:6px;overflow:hidden;display:grid;place-items:center;font-size:10px;color:var(--mut)}
.sth img{max-width:100%;max-height:100%}
.fstage{overflow-y:auto}
.fstage>.scenebox,.fstage>.tlcard,.fstage>.tr,.fstage>.sbar,.fstage>.strip,.fstage>.fbar{flex:none}
.fstage .stagebox{flex:1 0 250px}
/* Video curto (igual ao Filmora): biblioteca | propriedades | player na lateral direita inteira; timeline embaixo das duas primeiras colunas */
.lay-curto{grid-template-columns:minmax(170px,22%) minmax(190px,22%) minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr) auto!important;grid-template-areas:"left props player" "timeline timeline player"}
.lay-curto .fstage{display:contents}
.lay-curto .fbar,.lay-curto .strip,.lay-curto .sbar{display:none}
.lay-curto .leftpanel{grid-area:left}
.lay-curto .props{grid-area:props;display:block;min-height:0;overflow:auto}
.lay-curto .playcol{grid-area:player;flex:none;min-height:0;min-width:0}
.lay-curto .tlcard{grid-area:timeline;min-width:0}
.playcol{display:flex;flex-direction:column;gap:10px;flex:1 0 270px;min-height:0;min-width:0}
.playcol .stagebox{flex:1 1 auto!important;min-height:150px}
.lay-linha .playcol{flex:0 0 38%!important}.lay-organizar .playcol{flex:0 0 32%!important}
.leftpanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.lptabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line)}
.lt{background:none;border:0;border-bottom:2px solid transparent;padding:6px 12px;cursor:pointer;color:var(--mut)}
.lt.on{color:#fff;border-bottom-color:var(--ac)}
.lpbody{padding:10px;overflow:auto;min-height:0;flex:1}
.mbar{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mitem{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:grab}
.mitem:hover{border-color:var(--ac)}
.mth{height:72px;border-radius:6px;display:grid;place-items:center;overflow:hidden;background:#1a1824;position:relative}
.mth img{max-width:100%;max-height:100%}

<body>
<div id="app">
  <header id="top">
    <div class="brand"><div class="logo">🎬</div><b>Frame Studio</b><span class="pill">v0.1</span></div>
    <div class="sep"></div>
    <input id="pname" title="Nome do projeto">

  </header>
  <nav id="side"></nav>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtB=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';
const fmtT=s=>{s=Math.max(0,s);return pad(Math.floor(s/60))+':'+(s%60).toFixed(1).padStart(4,'0')};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3800)}
let LASTDL=null;
let DLCAP;
async function capDl(){if(DLCAP===undefined){try{DLCAP=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null}catch(e){DLCAP=null}}return DLCAP}
async function download(blob,name){
  /* versão publicada (artifact): o viewer só salva arquivos pela capability "downloads", com confirmação */
  const cap=await capDl();
  if(cap){
    const save=async()=>{try{await cap.save({filename:name,data:blob});toast('Arquivo salvo.')}catch(e){if(!e||e.code!=='declined')toast('Não foi possível salvar: '+((e&&(e.message||e.code))||'erro'))}};
    setTimeout(()=>{const m=$('#exMsg');if(m&&$('#modal').classList.contains('on')){const l=document.createElement('div');l.style.marginTop='8px';l.innerHTML=`<button class="btn pri" id="exCapSave">⬇ Salvar ${esc(name)}</button>`;m.appendChild(l);$('#exCapSave').onclick=save}},0);
    await save();return;
  }
  if(LASTDL)URL.revokeObjectURL(LASTDL.url);const url=URL.createObjectURL(blob);LASTDL={url,name};
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  /* se o navegador bloquear o download automático, o botão abaixo (clique do usuário) garante o arquivo */
  setTimeout(()=>{const m=$('#exMsg');if(m&&$('#modal').classList.contains('on')){const l=document.createElement('div');l.style.marginTop='8px';
    l.innerHTML=`<a class="btn pri" href="${url}" download="${esc(name)}" style="text-decoration:none;display:inline-block">⬇ Baixar ${esc(name)}</a>`+(window.showSaveFilePicker?` <button class="btn" id="exSaveAs">Salvar como…</button>`:'')+`<div class="mut" style="font-size:12px;margin-top:6px">Se nada foi baixado, clique no botão acima. Se ainda assim não baixar, abra o programa no Chrome ou no Edge (o painel do app pode bloquear downloads).</div>`;
    m.appendChild(l);const sb=$('#exSaveAs');if(sb)sb.onclick=async()=>{try{const ext=name.split('.').pop();const h=await showSaveFilePicker({suggestedName:name,types:[{description:ext.toUpperCase(),accept:{[blob.type||'application/octet-stream']:['.'+ext]}}]});const w=await h.createWritable();await w.write(blob);await w.close();toast('Arquivo salvo.')}catch(e){if(e.name!=='AbortError')toast('Não foi possível salvar: '+e.message)}}}},0);
}
function pick(multiple=true,accept='image/png,image/webp,image/jpeg'){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=multiple;i.onchange=()=>res([...i.files]);i.click()})}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

/* ============ estado ============ */
const newScene=(name,act,fps=12)=>({id:uid(),name,act,fps,target:24,done:false,frames:[]});
const newFrame=a=>({id:uid(),a,dur:1,ox:0,oy:0,s:100,flip:false,op:100});
function newProject(){return {name:'Gato Narrador',w:1080,h:1920,fps:12,pixel:false,script:null,labVerdict:{},ai:null,audio:[],
  scenes:[newScene('Introdução','comeco'),newScene('Desenvolvimento','meio'),newScene('Conclusão','fim')]}}
let P=newProject();
const assets={};   // id -> {id,name,type,w,h,bytes,blob,url,img}
const U={ov:null,leftTab:'media',showMedia:false,snap:true,lockV:false,lockA:false,layout:'padrao',zoom:1,guides:{},hideProps:false,playAll:true,pps:40,ph:0,clip:null,grid:false,view:'dash',sceneId:null,sel:0,exp:null,bg:'checker',bgc:'#3b82f6',q:.5,onion:{on:true,b:2,a:2,op:40},mode:'normal',loop:true,speed:1};
const ACTS=[['comeco','COMEÇO','Introdução e apresentação'],['meio','MEIO','Desenvolvimento e acontecimentos'],['fim','FIM','Conclusão e encerramento']];
const curScene=()=>P.scenes.find(s=>s.id===U.sceneId)||P.scenes[0];
const curFrame=()=>curScene().frames[U.sel];
const seqOf=s=>{const q=[];s.frames.forEach((f,i)=>{for(let k=0;k<Math.max(1,f.dur);k++)q.push(i)});
  if(q.length&&s.len>0){const base=q.slice(),need=Math.round(s.len*s.fps);while(q.length<need)q.push(base[q.length%base.length])}  /* "repetir até": reinicia o ciclo dos frames */
  return q};
const sceneDur=s=>seqOf(s).length/s.fps;
let hist=[],redoS=[];
function pushHist(){hist.push(JSON.stringify(P));if(hist.length>80)hist.shift();redoS.length=0}
function mut(fn){pushHist();fn();changed()}
function fixSel(){if(!P.audio)P.audio=[];if(!P.seqs)P.seqs=[];if(!P.media)P.media=[];if(!P.overlays)P.overlays=[];if(!P.ovTracks)P.ovTracks=1;if(!P.scenes.find(s=>s.id===U.sceneId))U.sceneId=P.scenes[0].id;if(U.exp&&!P.scenes.find(s=>s.id===U.exp))U.exp=null;const s=curScene();U.sel=Math.max(0,Math.min(U.sel,s.frames.length-1))}
function changed(){fixSel();render();autosave()}
function undo(){if(!hist.length)return;redoS.push(JSON.stringify(P));P=JSON.parse(hist.pop());changed()}
function redo(){if(!redoS.length)return;hist.push(JSON.stringify(P));P=JSON.parse(redoS.pop());changed()}

/* ============ assets ============ */
const MIME={png:'image/png',webp:'image/webp',jpg:'image/jpeg',jpeg:'image/jpeg'};
async function loadAsset(a){if(a.kind==='audio')return loadAudio(a);a.url=URL.createObjectURL(a.blob);a.img=new Image();a.img.src=a.url;await a.img.decode();a.w=a.img.naturalWidth;a.h=a.img.naturalHeight}
async function ingest(file){
  const buf=await file.arrayBuffer();let id;
  try{const d=await crypto.subtle.digest('SHA-256',buf);id=[...new Uint8Array(d)].slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join('')}catch{id=file.name+file.size}
  if(assets[id])return id;
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  const a={id,name:file.name,type:file.type||MIME[ext]||'image/png',bytes:file.size};
  a.blob=new Blob([buf],{type:a.type});await loadAsset(a);assets[id]=a;return id;
}
function usedIds(){const s=new Set();P.scenes.forEach(c=>c.frames.forEach(f=>s.add(f.a)));(P.ai?.slots||[]).forEach(x=>x.a&&s.add(x.a));(P.audio||[]).forEach(k=>s.add(k.a));(P.media||[]).forEach(id=>s.add(id));(P.seqs||[]).forEach(q=>q.frames.forEach(id=>s.add(id)));(P.overlays||[]).forEach(o=>s.add(o.a));return [...s].filter(i=>assets[i])}
const imgAssets=()=>Object.values(assets).filter(a=>a.kind!=='audio');
/* áudio */
let AC=null;const actx=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
async function loadAudio(a,buf){
  buf=buf||await a.blob.arrayBuffer();a.kind='audio';a.buf=await actx().decodeAudioData(buf.slice(0));a.dur=a.buf.duration;a.url=URL.createObjectURL(a.blob);
  const ch=a.buf.getChannelData(0),N=800,step=Math.max(1,Math.floor(ch.length/N));a.peaks=new Float32Array(N);
  for(let i=0;i<N;i++){let m=0;for(let j=i*step;j<(i+1)*step&&j<ch.length;j+=Math.max(1,step>>6))m=Math.max(m,Math.abs(ch[j]));a.peaks[i]=m}
}
async function ingestAudio(file){
  const buf=await file.arrayBuffer();let id;
  try{const d=await crypto.subtle.digest('SHA-256',buf);id='au'+[...new Uint8Array(d)].slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join('')}catch{id='au'+file.name+file.size}
  if(assets[id])return id;
  const a={id,kind:'audio',name:file.name,type:file.type||'audio/mpeg',bytes:file.size};a.blob=new Blob([buf],{type:a.type});await loadAudio(a,buf);assets[id]=a;return id;
}
/* zip (leitura) */
async function unzip(file){
  const u=new Uint8Array(await file.arrayBuffer()),dv=new DataView(u.buffer);let e=-1;
  for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('não é um zip válido');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[],dec=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
    const base=name.split('/').pop();if(!base||name.endsWith('/')||base.startsWith('.')||name.startsWith('__MACOSX'))continue;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u.subarray(ds,ds+cs);let data;
    if(method===0)data=raw;else if(method===8)data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());else continue;
    const ext=(base.split('.').pop()||'').toLowerCase();out.push(new File([data],base,{type:MIME[ext]||''}));
  }
  return out;
}
async function importFiles(files,at=null){
  let notes=null,zipSeen=false;const exp=[];
  for(const f of files){if(/\.zip$/i.test(f.name)){zipSeen=true;try{for(const x of await unzip(f)){if(/\.txt$|\.md$/i.test(x.name))notes=await x.text();else exp.push(x)}}catch(e){toast('Zip inválido: '+e.message)}}else exp.push(f)}
  files=exp;
  files=files.filter(f=>/^image\/(png|webp|jpeg)$/.test(f.type)||/\.(png|webp|jpe?g)$/i.test(f.name));
  if(!files.length){toast('Nenhuma imagem PNG, WebP ou JPG encontrada.');return}
  files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
  toast('Importando '+files.length+' imagem(ns)…');const ids=[];
  for(const f of files){try{ids.push(await ingest(f))}catch(e){toast('Falha ao ler '+f.name)}}
  if(!ids.length)return;
  /* uma única imagem que parece uma folha de sprites: oferece dividir em frames */
  if(ids.length===1&&!zipSeen&&await looksLikeSheet(assets[ids[0]])){toast('Esta imagem parece uma folha de sprites.');openSlicer(ids[0],{fromImport:true,at});return}
  const s=curScene();
  let extra='';
  mut(()=>{const pos=at==null?s.frames.length:at;s.frames.splice(pos,0,...ids.map(newFrame));(ids.length>1?regSeq(ids,(assets[ids[0]].name||'Sequência').replace(/\.[^.]+$/,'').replace(/[_\- ]*\d+$/,'')||'Sequência',s.fps):regMedia(ids));U.sel=pos;
    if(notes){const m=notes.match(/FPS sugerido:\s*(\d+)/i);if(m){s.fps=Math.max(1,Math.min(60,+m[1]));extra+=' FPS da cena ajustado para '+s.fps+' (nota do zip).'}if(/nearest/i.test(notes)){P.pixel=true;extra+=' Pixel art ativado.'}}});
  toast(ids.length+' frame(s) importado(s) em ordem natural.'+extra);
}

/* ============ desenho ============ */
const OFF=document.createElement('canvas');
function drawFrame(ctx,f,q,tint,alpha=1){
  const a=assets[f.a];if(!a)return;const W=P.w,H=P.h;
  const fit=Math.min(W/a.w,H/a.h),sc=fit*f.s/100,dw=a.w*sc,dh=a.h*sc;
  const put=c=>{c.save();c.translate(W/2+f.ox,H/2+f.oy);if(f.flip)c.scale(-1,1);c.imageSmoothingEnabled=!P.pixel;c.drawImage(a.img,-dw/2,-dh/2,dw,dh);c.restore()};
  if(tint){
    const cw=Math.round(W*q),ch=Math.round(H*q);if(OFF.width!==cw||OFF.height!==ch){OFF.width=cw;OFF.height=ch}
    const o=OFF.getContext('2d');o.setTransform(1,0,0,1,0,0);o.globalCompositeOperation='source-over';o.clearRect(0,0,cw,ch);
    o.setTransform(q,0,0,q,0,0);put(o);o.setTransform(1,0,0,1,0,0);o.globalCompositeOperation='source-atop';o.fillStyle=tint;o.fillRect(0,0,cw,ch);o.globalCompositeOperation='source-over';
    ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=alpha*f.op/100;ctx.drawImage(OFF,0,0);ctx.restore();
  }else{ctx.save();ctx.globalAlpha=alpha*f.op/100;put(ctx);ctx.restore()}
}
function paint(canvas,frame,o={}){
  const q=o.q??U.q,cw=Math.round(P.w*q),ch=Math.round(P.h*q);
  if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch}
  const ctx=canvas.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cw,ch);
  if(o.bg){ctx.fillStyle=o.bg;ctx.fillRect(0,0,cw,ch)}
  ctx.setTransform(q,0,0,q,0,0);
  if(o.onion&&o.scene){const on=U.onion;
    for(let k=on.b;k>=1;k--){const f=o.scene.frames[o.idx-k];if(f)drawFrame(ctx,f,q,'#8b5cf6',on.op/100*(1-(k-1)*.25))}
    for(let k=on.a;k>=1;k--){const f=o.scene.frames[o.idx+k];if(f)drawFrame(ctx,f,q,'#38bdf8',on.op/100*(1-(k-1)*.25))}
  }
  ctx.setTransform(q,0,0,q,0,0);
  if(frame)drawFrame(ctx,frame,q,null,1);
  if(o.t!=null&&P.overlays&&P.overlays.length)drawOverlays(ctx,q,o.t);
}
function fit(canvas){
  const isStage=canvas.id==='stage',el=isStage?canvas.parentElement:canvas,box=el&&el.parentElement;if(!box)return;
  const z=isStage?(U.zoom||1):1,bw=box.clientWidth-8,bh=box.clientHeight-8;if(bw<=0||bh<=0)return;
  const s=Math.min(bw/P.w,bh/P.h)*z;el.style.width=Math.floor(P.w*s)+'px';el.style.height=Math.floor(P.h*s)+'px';
  if(isStage)box.classList.toggle('zoomed',z>1);
}
/* guias sobre o player: zonas de segurança, grade de terços, linhas centrais */
function renderOv(){
  const o=$('#ov');if(!o)return;const g=U.guides||{};let h='';const ln=(c,s)=>`<i style="position:absolute;background:${c};${s}"></i>`;
  if(g.grid)h+=['left:33.333%;top:0;bottom:0;width:1px','left:66.666%;top:0;bottom:0;width:1px','top:33.333%;left:0;right:0;height:1px','top:66.666%;left:0;right:0;height:1px'].map(s=>ln('rgba(255,255,255,.6)',s)).join('');
  if(g.center)h+=ln('#22d3ee','left:50%;top:0;bottom:0;width:1px')+ln('#22d3ee','top:50%;left:0;right:0;height:1px');
  if(g.safe){h+=`<i style="position:absolute;inset:5%;border:1px dashed #fbbf24"></i><i style="position:absolute;inset:3.5%;border:1px dashed #34d399"></i>`;
    if(P.h/P.w>1.5)h+=ln('rgba(248,113,113,.22)','left:0;right:0;top:0;height:9%')+ln('rgba(248,113,113,.22)','left:0;right:0;bottom:0;height:20%')+`<span style="position:absolute;left:6px;bottom:6px;font-size:10px;color:#fecaca">interface do app (legenda/botões)</span>`}
  o.innerHTML=h;
}
const bgStyle=()=>U.bg==='color'?`style="background:${U.bgc}"`:'';
const bgCls=()=>U.bg==='color'?'':'bg-'+U.bg;

/* ============ reprodução ============ */
const PL={playing:false,kind:null,canvas:null,t0:0,last:null,m:null};
const LAB={last:null,alpha:null,align:null,comp:null,perf:null,live:null};
function projectSegs(){let t=0;return P.scenes.filter(s=>s.frames.length).map(s=>{const seq=seqOf(s),d=seq.length/s.fps,g={scene:s,seq,start:t,dur:d};t+=d;return g})}
function segFor(s){const seq=seqOf(s);return {scene:s,seq,start:0,dur:seq.length/s.fps}}
function locate(segs,t){let g=segs[segs.length-1];for(const x of segs){if(t<x.start+x.dur){g=x;break}}return {seg:g,i:Math.max(0,Math.min(g.seq.length-1,Math.floor((t-g.start)*g.scene.fps)))}}
function transitions(seq){let c=0;for(let i=0;i<seq.length;i++)if(seq[i]!==seq[(i+seq.length-1)%seq.length])c++;return c}
function play(kind,canvas){
  stop(true);if(kind==='scene'&&!curScene().frames.length){toast('Esta cena ainda não tem frames.');return}
  if(kind==='project'&&!projectSegs().length){toast('Nenhuma cena tem frames ainda.');return}

    const src=c.createBufferSource();src.buffer=a.buf;const g=c.createGain();

async function mediaImportFiles(files){
  files=[...files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
  const isImg=f=>/^image\/(png|webp|jpeg)$/.test(f.type)||/\.(png|webp|jpe?g)$/i.test(f.name),isAud=f=>/^audio\//.test(f.type)||/\.(mp3|wav|m4a|ogg|aac|flac)$/i.test(f.name);
  const seqs=[],singles=[],loose=[],seqName=n=>n.replace(/\.[^.]+$/,'').replace(/[_\- ]*\d+$/,'')||'Sequência';
  toast('Importando '+files.length+' arquivo(s)…');
  for(const f of files){
    try{
      if(/\.zip$/i.test(f.name)){
        const imgs=[];let fps=null;
        for(const x of await unzip(f)){
          if(/\.txt$|\.md$/i.test(x.name)){const m=(await x.text()).match(/FPS sugerido:\s*(\d+)/i);if(m)fps=+m[1]}
          else if(isImg(x))imgs.push(await ingest(x));

        }
        if(imgs.length>1)seqs.push({ids:imgs,name:f.name.replace(/\.zip$/i,''),fps});else singles.push(...imgs);
      }
      else if(isImg(f))loose.push({id:await ingest(f),name:f.name});
      else if(isAud(f))singles.push(await ingestAudio(f));
    }catch(e){toast('Não foi possível ler '+f.name)}
  }
  if(loose.length>1)seqs.push({ids:loose.map(x=>x.id),name:seqName(loose[0].name),fps:null});else if(loose.length===1)singles.push(loose[0].id);
  if(!seqs.length&&!singles.length){toast('Nenhum arquivo compatível (PNG, WebP, JPG, .zip, mp3, wav…).');return}
  mut(()=>{seqs.forEach(s=>regSeq(s.ids,s.name,s.fps||P.fps));regMedia(singles)});
  toast((seqs.length?seqs.length+' sequência(s) e ':'')+singles.length+' arquivo(s) na biblioteca de mídia.');
}

const FIT_W=1080,FIT_H=1920;

function planFit(scope,anchor){
  const scenes=scope==='scene'?[curScene()]:P.scenes,frames=scenes.flatMap(s=>s.frames).filter(f=>assets[f.a]);
  if(!frames.length)return null;
  const sel=curScene().frames[U.sel],refF=sel&&frames.includes(sel)?sel:frames[0],groups=new Map();
  for(const f of frames){const a=assets[f.a],k=a.w+'×'+a.h;let g=groups.get(k);if(!g){g={k,a,h:[],cx:[],cy:[],frames:[]};groups.set(k,g)}
    const b=bboxCached(a);g.h.push(b.h);g.cx.push(b.x+b.w/2);g.cy.push(anchor==='feet'?b.y+b.h:b.y+b.h/2);g.frames.push(f)}
  for(const g of groups.values()){g.mh=med(g.h);g.mcx=med(g.cx);g.mcy=med(g.cy);g.fit=Math.min(FIT_W/g.a.w,FIT_H/g.a.h)}
  const ra=assets[refF.a],r=groups.get(ra.w+'×'+ra.h),bx0=FIT_W/2+(r.mcx-r.a.w/2)*r.fit,by0=FIT_H/2+(r.mcy-r.a.h/2)*r.fit,hRef=r.mh*r.fit;
  for(const g of groups.values()){g.s=g===r?100:+(hRef/(g.mh*g.fit)*100).toFixed(2);g.sc=g.fit*g.s/100;
    g.oy=g===r?0:Math.round(by0-FIT_H/2-(g.mcy-g.a.h/2)*g.sc);g.dxc=(g.mcx-g.a.w/2)*g.sc;g.ox=g===r?0:Math.round(bx0-FIT_W/2-g.dxc);g.chPx=Math.round(g.mh*g.sc);g.bx0=bx0}
  return {groups:[...groups.values()],ref:r,refF};
}

function dataHasAlpha(d){const px=d.data,n=px.length/4;let c=0;for(let i=3;i<px.length;i+=4)if(px[i]<250)c++;return c/n>.01}
function bgColor(d,w,h){

/* máscara do primeiro plano: o fundo é o que se liga às bordas e tem a cor do fundo (a camisa branca por dentro do personagem é preservada) */
function makeMask(d,w,h,tol,bg,alphaMode){
  const px=d.data,n=w*h,m=new Uint8Array(n);
  if(alphaMode){for(let i=0;i<n;i++)m[i]=px[i*4+3]>12?1:0;return m}
  const t2=tol*tol,bgm=new Uint8Array(n),st=new Int32Array(n);let sp=0;
  const isBg=i=>{const j=i*4;if(px[j+3]<=12)return true;const dr=px[j]-bg[0],dg=px[j+1]-bg[1],db=px[j+2]-bg[2];return dr*dr+dg*dg+db*db<=t2};
  const push=i=>{if(!bgm[i]&&isBg(i)){bgm[i]=1;st[sp++]=i}};
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
  while(sp>0){const i=st[--sp],x=i%w,y=(i-x)/w;if(x>0)push(i-1);if(x<w-1)push(i+1);if(y>0)push(i-w);if(y<h-1)push(i+w)}
  for(let i=0;i<n;i++)m[i]=bgm[i]?0:1;return m;

  for(let x=0;x<w;x++){let last=-1e9;for(let y=0;y<h;y++){if(a[y*w+x])last=y;if(y-last<=r)b[y*w+x]=1}last=1e9;for(let y=h-1;y>=0;y--){if(a[y*w+x])last=y;if(last-y<=r)b[y*w+x]=1}}

function orderBoxes(b){

function getPix(a,max=1024){const sc=Math.min(1,max/Math.max(a.w,a.h)),w=Math.max(1,Math.round(a.w*sc)),h=Math.max(1,Math.round(a.h*sc));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(a.img,0,0,w,h);return {d:x.getImageData(0,0,w,h),w,h,sc}}
function analyzeAlpha(a){const {d}=getPix(a);const px=d.data;let tr=0,tl=0,op=0,sr=0,sg=0,sb=0;for(let i=0;i<px.length;i+=4){const al=px[i+3];if(al===0)tr++;else if(al===255)op++;else{tl++;sr+=px[i];sg+=px[i+1];sb+=px[i+2]}}
  const n=px.length/4,br=tl?(sr+sg+sb)/(3*tl):0;return {n,tr,tl,op,br,halo:tl>0&&br>200?'possível halo CLARO nas bordas':tl>0&&br<45?'possível halo ESCURO nas bordas':tl?'bordas sem halo evidente':'sem pixels semitransparentes (bordas serrilhadas ou sem alfa)'}}
function bboxOf(a){const {d,w,h,sc}=getPix(a,512);const px=d.data;let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(px[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return null;return {x:Math.round(x0/sc),y:Math.round(y0/sc),w:Math.round((x1-x0+1)/sc),h:Math.round((y1-y0+1)/sc)}}
async function compressTest(a){
  const c=document.createElement('canvas');c.width=a.w;c.height=a.h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(a.img,0,0);const o=x.getImageData(0,0,a.w,a.h).data;
  const blob=await new Promise(r=>c.toBlob(r,'image/webp',1));if(!blob||blob.type!=='image/webp')return {err:'Este navegador não codifica WebP.'};
  const im=new Image();im.src=URL.createObjectURL(blob);await im.decode();const c2=document.createElement('canvas');c2.width=a.w;c2.height=a.h;const x2=c2.getContext('2d',{willReadFrequently:true});x2.drawImage(im,0,0);const n=x2.getImageData(0,0,a.w,a.h).data;
  let max=0,sum=0;for(let i=0;i<o.length;i++){const df=Math.abs(o[i]-n[i]);if(df>max)max=df;sum+=df}URL.revokeObjectURL(im.src);
  return {orig:a.bytes,webp:blob.size,max,mean:sum/o.length,w:a.w,h:a.h};
}

  async aiImport(b){const [file]=await pick(false);if(!file)return;const id=await ingest(file),p=+b.dataset.p;mut(()=>{const s=P.ai.slots[p-1];if(!s.lock){s.a=id;s.st='importado'}})},
  async aiBatch(){const files=(await pick()).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!files.length)return;const ids=[];for(const f of files)ids.push(await ingest(f));let n=0;mut(()=>{for(const s of P.ai.slots){if(!ids.length)break;if(!s.lock&&!s.a){s.a=ids.shift();s.st='importado';n++}}});toast(n+' imagem(ns) distribuída(s). '+(ids.length?ids.length+' sobraram (sem posição vazia).':''))},
  aiApprove(b){mut(()=>{const s=P.ai.slots[b.dataset.p-1];if(s.a&&!s.lock)s.st='aprovado'})},
  aiReject(b){mut(()=>{const s=P.ai.slots[b.dataset.p-1];if(!s.lock)s.st='rejeitado'})},
  aiLock(b){mut(()=>{const s=P.ai.slots[b.dataset.p-1];s.lock=!s.lock})},
  aiCopy(b){const a=aiState();navigator.clipboard.writeText(aiPrompt(a,+b.dataset.p,aiPlan(a.n))).then(()=>toast('Prompt copiado.'),()=>toast('Não foi possível copiar.'))},
  aiCopyAll(){const a=aiState(),pl=aiPlan(a.n);navigator.clipboard.writeText(a.slots.map(s=>aiPrompt(a,s.pos,pl)).join('\n\n----\n\n')).then(()=>toast('Todos os prompts copiados.'),()=>toast('Não foi possível copiar.'))},
  aiDownload(){const a=aiState(),pl=aiPlan(a.n);download(new Blob([a.slots.map(s=>aiPrompt(a,s.pos,pl)).join('\n\n----\n\n')],{type:'text/plain'}),'prompts-ia.txt')},
  aiSend(){const a=P.ai,ap=a.slots.filter(s=>s.st==='aprovado'&&s.a);if(!ap.length)return;const s=curScene();mut(()=>{ap.forEach(x=>s.frames.push(newFrame(x.a)));U.sel=s.frames.length-1});toast(ap.length+' frame(s) enviados à cena “'+s.name+'”.');go('frames')},
  /* lab */
  verd(b){P.labVerdict[b.dataset.t]=b.dataset.v;if(!b.dataset.v)delete P.labVerdict[b.dataset.t];autosave();render()},
  refresh(){render()},
  labPlay(){const cv=$('#labcv');play('scene',cv);if(!PL.playing)return;setTimeout(()=>{if(PL.playing)stop()},5000)},
  labAlpha(){const f=curFrame();if(f){LAB.alpha=analyzeAlpha(assets[f.a]);render()}},
  labAlign(){const s=curScene(),rows=[];let ref=null,mx=0;const sizes=new Set();
    s.frames.forEach((f,i)=>{const a=assets[f.a];sizes.add(a.w+'x'+a.h);const b=bboxOf(a);if(b&&!ref)ref=b;const dx=b&&ref?(b.x+b.w/2)-(ref.x+ref.w/2):0,dy=b&&ref?(b.y+b.h)-(ref.y+ref.h):0;mx=Math.max(mx,Math.abs(dx),Math.abs(dy));rows.push({i:i+1,b,dx:Math.round(dx),dy:Math.round(dy)})});
    LAB.align={rows,mx:Math.round(mx),sizes:sizes.size};render()},
  async labComp(){const f=curFrame();if(!f)return;const r=await compressTest(assets[f.a]);LAB.comp=r.err?r:{n:1,orig:r.orig,webp:r.webp,max:r.max,mean:r.mean};render()},
  async labCompAll(){const s=curScene();let orig=0,webp=0,max=0,sum=0,n=0;toast('Analisando…');for(const id of new Set(s.frames.map(f=>f.a))){const r=await compressTest(assets[id]);if(r.err){LAB.comp=r;render();return}orig+=r.orig;webp+=r.webp;max=Math.max(max,r.max);sum+=r.mean;n++}LAB.comp={n,orig,webp,max,mean:sum/n};render()}
};

  onionOn:v=>{U.onion.on=v;paintStage()},onionB:v=>{U.onion.b=Math.max(0,+v||0);paintStage()},onionA:v=>{U.onion.a=Math.max(0,+v||0);paintStage()},onionOp:(v)=>{U.onion.op=+v;paintStage()},

  ckvol:v=>{ckl().vol=+v/100;const l=$('#ckvl');if(l)l.textContent=v+'%';autosave()},ckmute:v=>mut(()=>{ckl().mute=v}),
  scrub:v=>{stop();U.sel=+v-1;syncSel();renderProps()},
  aiDesc:v=>{aiState().desc=v;autosave()},aiDir:v=>{aiState().dir=v;autosave()},aiKeep:v=>{aiState().keep=v;autosave()},
  aiDur:v=>mut(()=>{aiState().dur=Math.max(1,+v||6)}),aiN:v=>mut(()=>{aiState().n=Math.max(3,Math.min(33,+v||9))}),
  aiuse(v,t){if(v==='')return;const f=curScene().frames[+v],p=+t.dataset.p;mut(()=>{const s=P.ai.slots[p-1];if(!s.lock){s.a=f.a;s.st='importado'}})}
};

document.addEventListener('input',e=>{const t=e.target;if(t.type==='range'&&t.dataset.bind)binds[t.dataset.bind](t.value,t,true)});

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag)&&!(e.key==='z'&&e.ctrlKey))return;
  if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}else if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}

  const g=U.guides||{};
  return `<h5>Modo layout (editor de Frames)</h5>`+[['padrao','Padrão'],['organizar','Organizar'],['linha','Linha do tempo'],['curto','Vídeo curto'],['classico','Clássico']].map(([v,l])=>it(U.layout===v,l,'viewSet','layout',v)).join('')
   +`<h5>Reprodução</h5>`+it(0,'Reproduzir / Pausar','viewSet','play','','Espaço')+it(0,'Parar','viewSet','stop','','')+it(0,'Tela cheia','viewSet','fs','','Alt+Enter')
   +`<h5>Qualidade de reprodução</h5>`+[[.33,'Rápida (33%)'],[.5,'Edição (50%)'],[1,'Completa (100%)']].map(([v,l])=>it(U.q===v,l,'viewSet','q',v)).join('')
   +`<h5>Nível de ampliação</h5>`+[[1,'Ajustar à tela'],[.5,'50%'],[.75,'75%'],[1.5,'150%'],[2,'200%']].map(([v,l])=>it((U.zoom||1)===v,l,'viewSet','zoom',v)).join('')
   +`<h5>Guias</h5>`+it(g.safe,'Zonas de segurança','viewSet','guide','safe')+it(g.grid,'Grade de terços','viewSet','guide','grid')+it(g.center,'Linhas centrais','viewSet','guide','center')
   +`<h5>Fundo da imagem</h5>`+[['checker','Xadrez (transparência)'],['white','Branco'],['black','Preto']].map(([v,l])=>it(U.bg===v,l,'viewSet','bg',v)).join('')
   +`<h5>Painéis</h5>`+it(!U.hideProps,'Painel de propriedades','viewSet','props','')+it(U.showStrip!==false,'Faixa de frames','viewSet','strip','')+it(U.showMedia,'Biblioteca de mídia (fora do modo Vídeo curto)','viewSet','media','');
}
function toggleVM(){
  const old=$('#vmenu');if(old){old.remove();return}
  const m=document.createElement('div');m.id='vmenu';m.className='vmenu';m.innerHTML=vmHTML();document.body.appendChild(m);
  const r=$('#vmBtn').getBoundingClientRect();m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+'px';m.style.top=(r.bottom+6)+'px';
}

document.addEventListener('pointerdown',e=>{const m=$('#vmenu');if(m&&!m.contains(e.target)&&!e.target.closest('#vmBtn'))m.remove()});

/* tela cheia: nativa quando permitida; senão, cobre a janela da página */
function refit(){const st=$('#stage'),pv=$('#pv');if(st)fit(st);if(pv)fit(pv)}
function inFs(){return !!(document.fullscreenElement||$('.pfs'))}
function exitFs(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});const p=$('.pfs');if(p){p.classList.remove('pfs');const x=$('#fsx');if(x)x.remove();setTimeout(refit,30)}}
function toggleFs(box){
  if(!box)return;if(inFs()){exitFs();return}
  const go=()=>{box.classList.add('pfs');const x=document.createElement('button');x.id='fsx';x.className='btn';x.textContent='✕ Sair da tela cheia';x.style.cssText='position:absolute;top:12px;right:12px;z-index:5;opacity:.85';x.onclick=e=>{e.stopPropagation();exitFs()};box.appendChild(x);setTimeout(refit,30)};
  const req=box.requestFullscreen||box.webkitRequestFullscreen;
  if(req){try{const r=req.call(box);if(r&&r.catch)r.catch(go)}catch(e){go()}}else go();
}
document.addEventListener('fullscreenchange',()=>setTimeout(refit,60));
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.pfs'))exitFs()});
document.addEventListener('click',e=>{
  const fsEl=document.fullscreenElement||$('.pfs');
  if(fsEl&&fsEl.contains(e.target)&&!e.target.closest('button')){if(U.view==='frames')acts.togglePlay();else acts.playProject()}
});
/* arrastar e soltar */
let DRAG=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(!t)return;DRAG={k:t.dataset.drag,v:t.dataset.dv};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x');t.classList.add('dragging')});
document.addEventListener('dragend',()=>{DRAG=null;hideGhost();$$('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{
  if(DRAG){const t=e.target.closest('[data-drop]');if(t&&t.dataset.drop===DRAG.k){e.preventDefault();$$('.over').forEach(x=>x.classList.remove('over'));t.classList.add('over');if(DRAG.k==='media')showGhost(t,e)}}
  else if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
document.addEventListener('drop',e=>{
  if(DRAG){const t=e.target.closest('[data-drop]');if(!t||t.dataset.drop!==DRAG.k)return;e.preventDefault();const d=DRAG;DRAG=null;
    if(d.k==='frame'){const ps=v=>String(v).includes(':')?String(v).split(':'):[curScene().id,v],[fs,fi]=ps(d.v),[ts,ti]=ps(t.dataset.dv);
      const A=P.scenes.find(x=>x.id===fs),B=P.scenes.find(x=>x.id===ts);
      if(A&&B){const from=+fi;let to=ti==='end'?B.frames.length:+ti;if(!(A===B&&from===to))mut(()=>{const [x]=A.frames.splice(from,1);if(A===B&&ti==='end')to=B.frames.length;B.frames.splice(to,0,x);U.sceneId=B.id;U.sel=to})}}
    else if(d.k==='media'){dropMedia(d.v,t,e)}
    else{mut(()=>{const i=P.scenes.findIndex(x=>x.id===d.v),[sc]=P.scenes.splice(i,1);
      if(t.dataset.dv){const j=P.scenes.findIndex(x=>x.id===t.dataset.dv);sc.act=P.scenes[j].act;P.scenes.splice(j,0,sc)}else{sc.act=t.dataset.dact;P.scenes.push(sc)}
      const o=k=>ACTS.findIndex(a=>a[0]===k);P.scenes=P.scenes.map((x,k)=>[x,k]).sort((a,b)=>o(a[0].act)-o(b[0].act)||a[1]-b[1]).map(x=>x[0])})}
    return}
  if(e.dataTransfer&&e.dataTransfer.files.length&&(U.view==='frames'||(U.view==='dash'&&U.exp))){e.preventDefault();const fl=[...e.dataTransfer.files];if(e.target.closest&&e.target.closest('.leftpanel')&&U.leftTab!=='scenes')mediaImportFiles(fl);else importFiles(fl)}
});

  mediaRemove(b){const id=b.dataset.id;mut(()=>{if(id.startsWith('seq:')){const sid=id.slice(4);P.seqs=(P.seqs||[]).filter(q=>q.id!==sid);P.overlays=P.overlays.filter(o=>o.seq!==sid)}else P.media=(P.media||[]).filter(x=>x!==id)})},
  mediaAdd(b){const id=b.dataset.id,m=b.dataset.m;if(id.startsWith('seq:')){mediaAddSeq(id.slice(4),m);return}
    if(m==='audio')addAudioClip(id,U.ph);
    else if(m==='scene'){const s=curScene();mut(()=>{s.frames.push(newFrame(id));U.sel=s.frames.length-1});toast('Imagem adicionada ao fim da cena “'+s.name+'”.')}
    else addOverlay(id,2,U.ph)},
  tlCut(){if(U.ov){cutOverlay();return}if(ckl()){if(U.lockA){toast('A faixa de áudio está travada.');return}acts.splitClip()}else{if(U.lockV){toast('A faixa de vídeo está travada.');return}cutVideo()}},
  tlDel(){if(U.ov){delOverlay();return}if(ckl()){if(U.lockA){toast('A faixa de áudio está travada.');return}acts.delClip()}else{if(U.lockV){toast('A faixa de vídeo está travada.');return}acts.delScene()}},
  tlSnap(b){U.snap=!U.snap;b.classList.toggle('on',U.snap);toast(U.snap?'Ímã ligado.':'Ímã desligado.')},
  tlZoomIn(){U.pps=Math.min(200,Math.round(U.pps*1.25));const z=$('#tlz');if(z)z.value=U.pps;renderTL()},
  tlZoomOut(){U.pps=Math.max(10,Math.round(U.pps/1.25));const z=$('#tlz');if(z)z.value=U.pps;renderTL()},
  tlFit(){const sc=$('.tlscroll');const w=(sc?sc.clientWidth:600)-20;U.pps=Math.max(10,Math.min(200,Math.floor(w/(tlLen()+1))));const z=$('#tlz');if(z)z.value=U.pps;renderTL()},
  tlLockV(){U.lockV=!U.lockV;renderTL()},tlLockA(){U.lockA=!U.lockA;renderTL()},
  tlMuteA(){P.audioMuted=!P.audioMuted;if(P.audioMuted)stopAudio();autosave();renderTL()}
});
{
